<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#8E2458" />
    <title>Gifts Galore | India's Premier Online Gift Marketplace</title>
    <script>
      // Single Page Apps for GitHub Pages - Redirect to root hash
      var path = window.location.pathname.replace(/^\/([^\/]+)\/?/, '');
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      if (path && !path.startsWith('#')) {
        window.location.replace('./#/' + path + search + hash);
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body>
    <p>Loading Gifts Galore...</p>
  </body>
</html>
